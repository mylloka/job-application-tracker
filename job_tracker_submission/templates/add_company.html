{% extends "base.html" %}
{% block title %}Add Company{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">CREATE</p><h1>Add Company</h1><p class="muted">Enter the company information below. Fields marked * are required.</p></div></div>
<section class="panel form-panel"><form method="post" action="{{ url_for('add_record', table='companies') }}">
{% include "_fields.html" %}
<div class="form-actions"><button class="btn" type="submit">Save Company</button><a class="btn btn-secondary" href="{{ url_for('list_records', table='companies') }}">Cancel</a></div>
</form></section>
{% endblock %}
