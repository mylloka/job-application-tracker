
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Tracker{% endblock %} | Job Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
    <div class="top-inner">

        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark" aria-hidden="true">✿</span>
            <span>Job Tracker</span>
        </a>

        <nav aria-label="Main navigation">
            <a href="{{ url_for('home') }}">Dashboard</a>
            <a href="{{ url_for('list_records', table='companies') }}">Companies</a>
            <a href="{{ url_for('list_records', table='jobs') }}">Jobs</a>
            <a href="{{ url_for('list_records', table='applications') }}">Applications</a>
            <a href="{{ url_for('list_records', table='contacts') }}">Contacts</a>
            <a href="{{ url_for('job_match') }}">Job Match</a>
        </nav>

    </div>
</header>

<main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<footer class="footer">
    COP4751 Course Project · Flask + MySQL
</footer>

</body>
</html>
